<script>
(function() {
  // Reader redirect: everyone except staff uses app.outoftheb-ox.de. Discourse stays the backend
  // (login, signup, password reset, mail unsubscribe, account preferences and admin keep working here).
  var READER = 'https://app.outoftheb-ox.de';
  var KEEP = /^\/(login|signup|session|auth|invites|email|admin|privacy|tos|faq|my\/preferences|u\/[^\/]+\/preferences|u\/(password-reset|activate-account|confirm|admin-login|account-created))(\/|$)/;
  var path = window.location.pathname;
  try {
    // Support valve: ?reader=0 keeps this browser on Discourse, ?reader=1 switches back
    var flag = new URLSearchParams(window.location.search).get('reader');
    if (flag === '0') localStorage.setItem('ox-no-reader', '1');
    if (flag === '1') localStorage.removeItem('ox-no-reader');
    if (localStorage.getItem('ox-no-reader')) return;
  } catch(e) {}
  if (KEEP.test(path)) return;

  function run() {
    var pre;
    try {
      var el = document.getElementById('data-preloaded');
      pre = JSON.parse(el.dataset.preloaded || el.textContent);
    } catch(e) { return; }  // fail safe: unreadable data (Discourse changed its format before) = no redirect
    var user = null;
    try { user = pre.currentUser ? JSON.parse(pre.currentUser) : null; } catch(e) { return; }
    if (user && (user.staff || user.admin || user.moderator)) return;
    if (!user && (path === '/' || path === '')) return;  // anonymous on the root: login, see below

    // The reader understands Discourse topic and category URLs; everything else lands on its home
    var target = /^\/(t|c)\//.test(path) ? path : (/\/messages(\/|$)/.test(path) ? '/nachrichten/' : '/');
    document.documentElement.style.visibility = 'hidden';
    window.location.replace(READER + target);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
